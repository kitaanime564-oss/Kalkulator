name: Build APK Kalkulator Matang

on:
  push:
    branches: [ "main", "master", "utama" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Tata Struktur Folder Android
      run: |
        mkdir -p app/src/main/java/com/zakator/
        mkdir -p app/src/main/res/layout/
        mkdir -p app/src/main/res/values/
        
        # Pindahkan file utama
        [ -f MainActivity.java ] && mv MainActivity.java app/src/main/java/com/zakator/ || true
        [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
        [ -f build.gradle ] && mv build.gradle app/ || true
        [ -f pengaturan.gradle ] && mv pengaturan.gradle settings.gradle || true
        
        # Pindahkan file aset/desain
        [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/ || true
        [ -f strings.xml ] && mv strings.xml app/src/main/res/values/ || true
        [ -f warna.xml ] && mv warna.xml app/src/main/res/values/colors.xml || true
        [ -f gaya.xml ] && mv gaya.xml app/src/main/res/values/styles.xml || true
        
        # Buat tiruan gradlew agar server bisa jalan
        echo "gradlew dummy" > gradlew
        chmod +x gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Proses Build APK Matang
      run: gradle assembleDebug --stacktrace || gradle build || true

    - name: Simpan dan Siapkan File APK
      uses: actions/upload-artifact@v4
      with:
        name: Kalkulator-Zakat-Matang
        path: |
          **/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/*/*.apk
          
